<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Coach Flip" />
  <title>Coach Flip - form check</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main id="app" aria-live="polite"><p class="loading">Loading Coach Flip…</p></main>
  <!-- hidden pickers: capture opens the camera directly on phones -->
  <input id="pick-record" type="file" accept="video/*" capture="environment" class="vh" tabindex="-1" aria-hidden="true" />
  <input id="pick-video" type="file" accept="video/*" class="vh" tabindex="-1" aria-hidden="true" />
  <input id="pick-photo" type="file" accept="image/*" class="vh" tabindex="-1" aria-hidden="true" />
  <script type="module" src="js/app.js"></script>
</body>
</html>
